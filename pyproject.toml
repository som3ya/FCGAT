[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fcgat"
version = "0.1.0"
description = "FCGAT: Interpretable malware classification using Function Call Graph and Attention"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "FCGAT contributors"}
]
keywords = ["malware", "graph neural network", "function call graph", "explainable AI"]

dependencies = [
  "numpy>=1.22",
  "pandas>=1.5",
  "tqdm>=4.64",
  "gensim>=4.3",
  "networkx>=2.8",
  "pydot>=1.4",
  "scikit-learn>=1.1",
]

[project.optional-dependencies]
train = [
  "torch>=1.11",
  "torch-geometric>=2.0",
  # NOTE: torch-scatter/torch-sparse/torch-cluster wheels depend on torch/cuda.
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
